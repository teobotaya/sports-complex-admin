<text x="141.5" y="208.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Empleado /</text>
<text x="141.5" y="225.5" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Administrador</text>
<text x="468.7" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Frontend</text>
<text x="468.7" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >Pagos.tsx</text>
<text x="918.1" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">PagosController</text>
<text x="918.1" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST /api/pagos</text>
<text x="1165.5" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">PagoService</text>
<text x="1593.3" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Base de datos</text>
<text x="1593.3" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >SQL Server</text>
<text x="153.5" y="272.0" font-size="12" text-anchor="start" fill="#1f2933" >1. elige la reserva, escribe el monto y el método</text>
<text x="480.7" y="318.0" font-size="12" text-anchor="start" fill="#1f2933" >2. POST /api/pagos {idReserva, monto, metodoPago}</text>
<text x="930.1" y="364.0" font-size="12" text-anchor="start" fill="#1f2933" >3. RegistrarAsync(dto, idUsuario)</text>
<text x="1153.5" y="458.0" font-size="12" text-anchor="end" fill="#1f2933" >4. BusinessRuleException</text>
<text x="906.1" y="504.0" font-size="12" text-anchor="end" fill="#1f2933" >5. 400 · monto mayor a cero / método obligatorio</text>
<text x="456.7" y="550.0" font-size="12" text-anchor="end" fill="#1f2933" >6. muestra el error</text>
<text x="1177.5" y="638.0" font-size="12" text-anchor="start" fill="#1f2933" >7. buscar la reserva con su cancha</text>
<text x="1581.3" y="684.0" font-size="12" text-anchor="end" fill="#1f2933" >8. reserva + precio por hora</text>
<text x="1153.5" y="778.0" font-size="12" text-anchor="end" fill="#1f2933" >9. BusinessRuleException</text>
<text x="906.1" y="824.0" font-size="12" text-anchor="end" fill="#1f2933" >10. 400 · «No pueden registrarse pagos sobre reservas canceladas.»</text>
<text x="456.7" y="870.0" font-size="12" text-anchor="end" fill="#1f2933" >11. muestra el error</text>
<text x="1177.5" y="958.0" font-size="12" text-anchor="start" fill="#1f2933" >12. sumar lo ya abonado</text>
<text x="1581.3" y="1004.0" font-size="12" text-anchor="end" fill="#1f2933" >13. total abonado</text>
<text x="1217.5" y="1074.0" font-size="12" text-anchor="start" fill="#1f2933" >14. saldo = precio por hora × horas − abonado</text>
<text x="1153.5" y="1166.0" font-size="12" text-anchor="end" fill="#1f2933" >15. BusinessRuleException</text>
<text x="906.1" y="1212.0" font-size="12" text-anchor="end" fill="#1f2933" >16. 400 · «El monto supera el saldo pendiente…»</text>
<text x="456.7" y="1258.0" font-size="12" text-anchor="end" fill="#1f2933" >17. muestra el error</text>
<text x="1177.5" y="1346.0" font-size="12" text-anchor="start" fill="#1f2933" >18. INSERT Pago (fecha del día, usuario que cobra)</text>
<text x="1177.5" y="1392.0" font-size="12" text-anchor="start" fill="#1f2933" >19. INSERT Auditoria (Alta de Pago, usuario, fecha y hora)</text>
<text x="1177.5" y="1438.0" font-size="12" text-anchor="start" fill="#1f2933" >20. sumar los pagos de la reserva</text>
<text x="1581.3" y="1484.0" font-size="12" text-anchor="end" fill="#1f2933" >21. total abonado</text>
<text x="1217.5" y="1554.0" font-size="12" text-anchor="start" fill="#1f2933" >22. estado = Pendiente / Parcialmente abonado / Abonado</text>
<text x="1177.5" y="1598.0" font-size="12" text-anchor="start" fill="#1f2933" >23. UPDATE Reserva.estado_pago + INSERT Auditoria</text>
<text x="1153.5" y="1644.0" font-size="12" text-anchor="end" fill="#1f2933" >24. PagoDto (con «registrado por»)</text>
<text x="906.1" y="1690.0" font-size="12" text-anchor="end" fill="#1f2933" >25. 200 OK</text>
<text x="456.7" y="1736.0" font-size="12" text-anchor="end" fill="#1f2933" >26. muestra el nuevo estado de pago</text>
<text x="40.0" y="44.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold">Diagrama de Secuencia — CU-03 Registrar pago</text>
<text x="40.0" y="70.0" font-size="13" text-anchor="start" fill="#52606d" >UML · el estado de pago de la reserva se recalcula en cada pago: Pendiente, Parcialmente abonado o Abonado</text>
</svg>