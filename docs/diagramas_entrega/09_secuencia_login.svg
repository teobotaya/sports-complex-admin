<text x="141.5" y="208.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Empleado /</text>
<text x="141.5" y="225.5" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Administrador</text>
<text x="503.3" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Frontend</text>
<text x="503.3" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >Login.tsx · AuthContext</text>
<text x="829.2" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">AuthController</text>
<text x="829.2" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST /api/auth/login</text>
<text x="1073.2" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">UsuarioService</text>
<text x="1412.8" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">JwtTokenService</text>
<text x="1641.5" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Base de datos</text>
<text x="1641.5" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >SQL Server · tabla Usuario</text>
<text x="153.5" y="272.0" font-size="12" text-anchor="start" fill="#1f2933" >1. ingresa usuario y contraseña</text>
<text x="515.3" y="318.0" font-size="12" text-anchor="start" fill="#1f2933" >2. POST /api/auth/login {username, password}</text>
<text x="841.2" y="364.0" font-size="12" text-anchor="start" fill="#1f2933" >3. LoginAsync(request)</text>
<text x="1085.2" y="410.0" font-size="12" text-anchor="start" fill="#1f2933" >4. buscar usuario por username</text>
<text x="1629.5" y="456.0" font-size="12" text-anchor="end" fill="#1f2933" >5. usuario (o ninguno)</text>
<text x="1061.2" y="550.0" font-size="12" text-anchor="end" fill="#1f2933" >6. UnauthorizedException</text>
<text x="817.2" y="596.0" font-size="12" text-anchor="end" fill="#1f2933" >7. 401 · «Usuario o contraseña inválidos.»</text>
<text x="491.3" y="642.0" font-size="12" text-anchor="end" fill="#1f2933" >8. muestra el error sin decir qué dato falló</text>
<text x="1125.2" y="754.0" font-size="12" text-anchor="start" fill="#1f2933" >9. VerifyHashedPassword(hash, contraseña)</text>
<text x="1085.2" y="798.0" font-size="12" text-anchor="start" fill="#1f2933" >10. GenerateToken(usuario)</text>
<text x="1400.8" y="844.0" font-size="12" text-anchor="end" fill="#1f2933" >11. token JWT (vence en 120 min)</text>
<text x="1061.2" y="890.0" font-size="12" text-anchor="end" fill="#1f2933" >12. LoginResponse(token, usuario)</text>
<text x="817.2" y="936.0" font-size="12" text-anchor="end" fill="#1f2933" >13. 200 OK · token + usuario</text>
<text x="555.3" y="1006.0" font-size="12" text-anchor="start" fill="#1f2933" >14. guarda token y usuario (localStorage)</text>
<text x="491.3" y="1050.0" font-size="12" text-anchor="end" fill="#1f2933" >15. abre la pantalla de inicio según el rol</text>
<text x="40.0" y="44.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold">Diagrama de Secuencia — CU-10 Iniciar sesión</text>
<text x="40.0" y="70.0" font-size="13" text-anchor="start" fill="#52606d" >UML · mensajes reales entre capas (React → API ASP.NET Core → servicios → SQL Server) · línea llena = llamada, punteada = respuesta</text>
</svg>