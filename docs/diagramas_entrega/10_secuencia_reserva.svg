<text x="568.8" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >NuevaReserva.tsx</text>
<text x="1078.7" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ReservasController</text>
<text x="1078.7" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST /api/reservas</text>
<text x="1298.9" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ReservaService</text>
<text x="1723.2" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ReglasHorario</text>
<text x="1924.7" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DisponibilidadService</text>
<text x="2317.9" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Base de datos</text>
<text x="2317.9" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >SQL Server</text>
<text x="153.5" y="272.0" font-size="12" text-anchor="start" fill="#1f2933" >1. elige cliente, cancha, fecha y horas enteras (+ observaciones)</text>
<text x="580.8" y="318.0" font-size="12" text-anchor="start" fill="#1f2933" >2. POST /api/reservas (token JWT)</text>
<text x="1090.7" y="364.0" font-size="12" text-anchor="start" fill="#1f2933" >3. CreateAsync(dto, idUsuario)</text>
<text x="1310.9" y="410.0" font-size="12" text-anchor="start" fill="#1f2933" >4. ValidarTurno(horaInicio, horaFin)</text>
<text x="1711.2" y="504.0" font-size="12" text-anchor="end" fill="#1f2933" >5. BusinessRuleException</text>
<text x="1286.9" y="550.0" font-size="12" text-anchor="end" fill="#1f2933" >6. error de regla de negocio</text>
<text x="1066.7" y="596.0" font-size="12" text-anchor="end" fill="#1f2933" >7. 400 · «Los turnos solo pueden empezar y terminar en horas enteras…»</text>
<text x="556.8" y="642.0" font-size="12" text-anchor="end" fill="#1f2933" >8. muestra el aviso en rojo</text>
<text x="1711.2" y="730.0" font-size="12" text-anchor="end" fill="#1f2933" >9. turno válido</text>
<text x="1310.9" y="776.0" font-size="12" text-anchor="start" fill="#1f2933" >10. ¿existe el cliente? ¿la cancha está activa?</text>
<text x="2305.9" y="822.0" font-size="12" text-anchor="end" fill="#1f2933" >11. sí</text>
<text x="1310.9" y="868.0" font-size="12" text-anchor="start" fill="#1f2933" >12. ValidarDisponibilidadReservaAsync(cancha, fecha, inicio, fin)</text>
<text x="1936.7" y="914.0" font-size="12" text-anchor="start" fill="#1f2933" >13. buscar reservas no canceladas y partidos superpuestos</text>
<text x="2305.9" y="960.0" font-size="12" text-anchor="end" fill="#1f2933" >14. resultado</text>
<text x="1912.7" y="1054.0" font-size="12" text-anchor="end" fill="#1f2933" >15. ConflictException</text>
<text x="1286.9" y="1100.0" font-size="12" text-anchor="end" fill="#1f2933" >16. conflicto</text>
<text x="1066.7" y="1146.0" font-size="12" text-anchor="end" fill="#1f2933" >17. 409 · «Ya existe una reserva…» o «La cancha está reservada por torneo…»</text>
<text x="556.8" y="1192.0" font-size="12" text-anchor="end" fill="#1f2933" >18. pide elegir otra hora o cancha</text>
<text x="1912.7" y="1280.0" font-size="12" text-anchor="end" fill="#1f2933" >19. sin superposición</text>
<text x="1310.9" y="1326.0" font-size="12" text-anchor="start" fill="#1f2933" >20. INSERT Reserva (Confirmada, pago Pendiente)</text>
<text x="2305.9" y="1372.0" font-size="12" text-anchor="end" fill="#1f2933" >21. id_reserva</text>
<text x="1286.9" y="1418.0" font-size="12" text-anchor="end" fill="#1f2933" >22. ReservaDto</text>
<text x="1066.7" y="1464.0" font-size="12" text-anchor="end" fill="#1f2933" >23. 200 OK · reserva creada</text>
<text x="556.8" y="1510.0" font-size="12" text-anchor="end" fill="#1f2933" >24. «Reserva registrada correctamente.»</text>
<text x="40.0" y="44.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold">Diagrama de Secuencia — CU-01 Registrar reserva</text>
<text x="40.0" y="70.0" font-size="13" text-anchor="start" fill="#52606d" >UML · incluye la regla de turnos por horas enteras y la validación de disponibilidad (reservas y partidos)</text>
