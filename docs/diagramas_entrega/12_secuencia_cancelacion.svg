<text x="509.4" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >Reservas.tsx · Cancelaciones.tsx</text>
<text x="950.6" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ReservasController</text>
