<text x="541.7" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >Reservas.tsx · Cancelaciones.tsx</text>
<text x="982.9" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ReservasController</text>
<text x="982.9" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST …/{id}/cancelar</text>
<text x="1304.8" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">CancelacionService</text>
<text x="1734.7" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DevolucionesController</text>
<text x="1734.7" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST /api/devoluciones</text>
<text x="1977.0" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DevolucionService</text>
<text x="2388.4" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Base de datos</text>
<text x="2388.4" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >SQL Server</text>
<text x="153.5" y="272.0" font-size="12" text-anchor="start" fill="#1f2933" >1. toca «Cancelar» y confirma</text>
<text x="553.7" y="318.0" font-size="12" text-anchor="start" fill="#1f2933" >2. POST /api/reservas/{id}/cancelar</text>
<text x="994.9" y="364.0" font-size="12" text-anchor="start" fill="#1f2933" >3. CancelarReservaAsync(id, idUsuario, motivo)</text>
<text x="1316.8" y="410.0" font-size="12" text-anchor="start" fill="#1f2933" >4. buscar la reserva</text>
<text x="2376.4" y="456.0" font-size="12" text-anchor="end" fill="#1f2933" >5. reserva</text>
<text x="1292.8" y="550.0" font-size="12" text-anchor="end" fill="#1f2933" >6. BusinessRuleException</text>
<text x="970.9" y="596.0" font-size="12" text-anchor="end" fill="#1f2933" >7. 400 · «Una reserva ya cancelada no puede volver a cancelarse.»</text>
<text x="529.7" y="642.0" font-size="12" text-anchor="end" fill="#1f2933" >8. muestra el error</text>
<text x="1316.8" y="730.0" font-size="12" text-anchor="start" fill="#1f2933" >9. UPDATE estado = Cancelada · INSERT Cancelacion (usuario)</text>
<text x="1316.8" y="776.0" font-size="12" text-anchor="start" fill="#1f2933" >10. INSERT Auditoria (cambio de estado y alta de la cancelación)</text>
<text x="1292.8" y="822.0" font-size="12" text-anchor="end" fill="#1f2933" >11. CancelacionDto</text>
<text x="970.9" y="868.0" font-size="12" text-anchor="end" fill="#1f2933" >12. 200 OK</text>
<text x="529.7" y="914.0" font-size="12" text-anchor="end" fill="#1f2933" >13. la reserva figura Cancelada y el horario queda libre</text>
<text x="153.5" y="1022.0" font-size="12" text-anchor="start" fill="#1f2933" >14. «Registrar devolución»: monto (total o parcial) y método</text>
<text x="553.7" y="1068.0" font-size="12" text-anchor="start" fill="#1f2933" >15. POST /api/devoluciones {idCancelacion, monto, método}</text>
<text x="1746.7" y="1114.0" font-size="12" text-anchor="start" fill="#1f2933" >16. RegistrarAsync(dto, idUsuario)</text>
<text x="1989.0" y="1160.0" font-size="12" text-anchor="start" fill="#1f2933" >17. ¿existe la cancelación? ¿ya tiene devolución? total pagado</text>
<text x="2376.4" y="1206.0" font-size="12" text-anchor="end" fill="#1f2933" >18. datos</text>
<text x="1965.0" y="1300.0" font-size="12" text-anchor="end" fill="#1f2933" >19. excepción</text>
<text x="1722.7" y="1346.0" font-size="12" text-anchor="end" fill="#1f2933" >20. 400 / 409 · sin pagos, ya devuelta o monto mayor al abonado</text>
<text x="529.7" y="1392.0" font-size="12" text-anchor="end" fill="#1f2933" >21. muestra el error</text>
<text x="1989.0" y="1480.0" font-size="12" text-anchor="start" fill="#1f2933" >22. INSERT Devolucion (usuario) + INSERT Auditoria</text>
<text x="1965.0" y="1526.0" font-size="12" text-anchor="end" fill="#1f2933" >23. DevolucionDto</text>
<text x="1722.7" y="1572.0" font-size="12" text-anchor="end" fill="#1f2933" >24. 200 OK</text>
<text x="529.7" y="1618.0" font-size="12" text-anchor="end" fill="#1f2933" >25. la devolución figura Realizada</text>
<text x="40.0" y="44.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold">Diagrama de Secuencia — CU-02 Cancelar reserva y CU-04 Registrar devolución</text>
<text x="40.0" y="70.0" font-size="13" text-anchor="start" fill="#52606d" >UML · la devolución es opcional: sólo corresponde si la reserva cancelada tenía pagos (extensión del CU-02)</text>
