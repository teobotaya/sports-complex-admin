<text x="1702.4" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DevolucionesController</text>
<text x="1702.4" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >POST /api/devoluciones</text>
<text x="1927.5" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DevolucionService</text>
<text x="2338.9" y="152.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">Base de datos</text>
<text x="2338.9" y="170.0" font-size="12" text-anchor="middle" fill="#52606d" >SQL Server</text>
<text x="153.5" y="272.0" font-size="12" text-anchor="start" fill="#1f2933" >1. toca «Cancelar» y confirma</text>
<text x="521.4" y="318.0" font-size="12" text-anchor="start" fill="#1f2933" >2. POST /api/reservas/{id}/cancelar</text>
<text x="962.6" y="364.0" font-size="12" text-anchor="start" fill="#1f2933" >3. CancelarReservaAsync(id, idUsuario, motivo)</text>
<text x="1284.4" y="410.0" font-size="12" text-anchor="start" fill="#1f2933" >4. buscar la reserva</text>
<text x="2326.9" y="456.0" font-size="12" text-anchor="end" fill="#1f2933" >5. reserva</text>
<text x="1260.4" y="550.0" font-size="12" text-anchor="end" fill="#1f2933" >6. BusinessRuleException</text>
<text x="938.6" y="596.0" font-size="12" text-anchor="end" fill="#1f2933" >7. 400 · «Una reserva ya cancelada no puede volver a cancelarse.»</text>
<text x="497.4" y="642.0" font-size="12" text-anchor="end" fill="#1f2933" >8. muestra el error</text>
<text x="1284.4" y="730.0" font-size="12" text-anchor="start" fill="#1f2933" >9. UPDATE estado = Cancelada · INSERT Cancelacion</text>
<text x="1260.4" y="776.0" font-size="12" text-anchor="end" fill="#1f2933" >10. CancelacionDto</text>
<text x="938.6" y="822.0" font-size="12" text-anchor="end" fill="#1f2933" >11. 200 OK</text>
<text x="497.4" y="868.0" font-size="12" text-anchor="end" fill="#1f2933" >12. la reserva figura Cancelada y el horario queda libre</text>
<text x="153.5" y="976.0" font-size="12" text-anchor="start" fill="#1f2933" >13. «Registrar devolución» y elige el método</text>
<text x="521.4" y="1022.0" font-size="12" text-anchor="start" fill="#1f2933" >14. POST /api/devoluciones {idCancelacion, monto, método}</text>
<text x="1714.4" y="1068.0" font-size="12" text-anchor="start" fill="#1f2933" >15. RegistrarAsync(dto)</text>
<text x="1939.5" y="1114.0" font-size="12" text-anchor="start" fill="#1f2933" >16. ¿existe la cancelación? ¿ya tiene devolución? total pagado</text>
<text x="2326.9" y="1160.0" font-size="12" text-anchor="end" fill="#1f2933" >17. datos</text>
<text x="1915.5" y="1254.0" font-size="12" text-anchor="end" fill="#1f2933" >18. excepción</text>
<text x="1690.4" y="1300.0" font-size="12" text-anchor="end" fill="#1f2933" >19. 400 / 409 · sin pagos, ya devuelta o monto mayor al abonado</text>
<text x="497.4" y="1346.0" font-size="12" text-anchor="end" fill="#1f2933" >20. muestra el error</text>
<text x="1939.5" y="1434.0" font-size="12" text-anchor="start" fill="#1f2933" >21. INSERT Devolucion</text>
<text x="1915.5" y="1480.0" font-size="12" text-anchor="end" fill="#1f2933" >22. DevolucionDto</text>
<text x="1690.4" y="1526.0" font-size="12" text-anchor="end" fill="#1f2933" >23. 200 OK</text>
<text x="497.4" y="1572.0" font-size="12" text-anchor="end" fill="#1f2933" >24. la devolución figura Realizada</text>
<text x="40.0" y="44.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold">Diagrama de Secuencia — CU-02 Cancelar reserva y CU-04 Registrar devolución</text>
<text x="40.0" y="70.0" font-size="13" text-anchor="start" fill="#52606d" >UML · la devolución es opcional: sólo corresponde si la reserva cancelada tenía pagos (extensión del CU-02)</text>
